<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { -webkit-tap-highlight-color: transparent; outline: none; box-sizing: border-box; }
        body { margin: 0; display: flex; flex-direction: column; align-items: center; background: radial-gradient(circle at center, #FFD700 30%, #DAA520 60%, #8B4513 100%); min-height: 100vh; font-family: 'Arial Black', sans-serif; overflow: hidden; }

        .header-container { display: flex; gap: 8px; margin-top: 10px; cursor: pointer; align-items: center; }
        .ball { width: 35px; height: 35px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 900; color: white; border: none; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6), rgba(0,0,0,0.2)); box-shadow: inset -2px -2px 5px rgba(0,0,0,0.4); font-size: 0.7em; }
        .blue { background-color: #3498db; } .green { background-color: #27ae60; } .black { background-color: #2c3e50; font-size: 0.6em; } .red { background-color: #c0392b; } 
        .white-ball { background-color: #ffffff; color: black; font-size: 0.6em; }
        .purple { background-color: #9b59b6; }

        .rect-container { display: flex; gap: 6px; margin-top: 10px; margin-bottom: 10px; } 
        .custom-rect { width: 140px; height: 80px; background: rgba(0, 128, 0, 0.5); border: 3px solid #ddd; clip-path: polygon(0% 0%, 10% 10%, 20% 0%, 30% 10%, 40% 0%, 90% 0%, 100% 10%, 100% 90%, 90% 100%, 80% 90%, 70% 100%, 60% 90%, 50% 100%, 10% 100%, 0% 90%); box-shadow: 0 10px 0 #004d00; display: flex; justify-content: center; align-items: center; position: relative; }
        .sum-text { font-size: 2em; font-weight: 900; color: white; }
        .player-label { position: absolute; top: 2px; font-size: 0.6em; color: black; font-weight: 900; }
        
        .winner { animation: blink 1s infinite alternate; border: 4px solid gold !important; }
        @keyframes blink { from { background: rgba(255, 215, 0, 0.4); } to { background: rgba(255, 215, 0, 1); } }

        .small-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: 95vw; margin-top: 5px; perspective: 1000px; }
        .flip-card { height: 75px; cursor: pointer; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .flip-card.flipped { transform: rotateY(180deg); }
        
        .front { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; justify-content: center; align-items: center; clip-path: polygon(0% 0%, 10% 10%, 20% 0%, 30% 10%, 40% 0%, 90% 0%, 100% 10%, 100% 90%, 90% 100%, 80% 90%, 70% 100%, 60% 90%, 50% 100%, 10% 100%, 0% 90%); background: rgba(0, 128, 0, 0.5); border: 2px solid #ddd; font-weight: 900; font-size: 2.2em; color: black; }
        .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; clip-path: polygon(0% 0%, 10% 10%, 20% 0%, 30% 10%, 40% 0%, 90% 0%, 100% 10%, 100% 90%, 90% 100%, 80% 90%, 70% 100%, 60% 90%, 50% 100%, 10% 100%, 0% 90%); background: white; transform: rotateY(180deg); border: 2px solid #ddd; font-weight: 900; }
        
        .val-text { font-size: 2em; color: black; }
        .key-text { font-size: 2em; color: gold; }
        .key-icon { font-size: 1.5em; margin-bottom: -5px; }
        
        .glowing-gold { animation: superPulse 0.5s infinite alternate !important; border: 4px solid #FFD700 !important; background: #fffdf0 !important; }
        @keyframes superPulse { 0% { transform: scale(1) rotateY(180deg); box-shadow: 0 0 10px gold; } 100% { transform: scale(1.05) rotateY(180deg); box-shadow: 0 0 30px gold; } }
    </style>
</head>
<body onclick="makeFullScreen()">
    <div class="header-container">
        <button class="ball blue" onclick="setMode(3)">3</button>
        <button class="ball green" onclick="setMode(4)">4</button>
        <button class="ball purple" onclick="setMode(5)">5</button>
        <button class="ball black" onclick="resetAndShuffle()">MIX</button>
        <button class="ball red" onclick="activateKeyMode()">🔑</button>
        <button class="ball white-ball" onclick="activateFreeMode()">FREE</button>
        <button class="ball white-ball" onclick="toggleReveal()">👁️</button>
    </div>

    <div class="rect-container">
        <div id="rect1" class="custom-rect"><span class="player-label">اللاعب الأول</span><div id="box1" class="sum-text">0</div></div>
        <div id="rect2" class="custom-rect"><span class="player-label">اللاعب الثاني</span><div id="box2" class="sum-text">0</div></div>
    </div>

    <div class="small-grid" id="grid"></div>

    <script>
        let mode = 3, keyMode = false, isKeyFound = false, revealed = false, freeMode = false;
        let openOrder = [];
        let baseItems = ['1000', 900, 900, 900, 900, 800, 800, 800, 800, 700, 700, 700, 700, 700, 600, 600, 600, 600, 600, 600, 500, 500, 500, 500, 500, 400, 400, 400, 400, 300, 300, 300];

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            let items = [...baseItems].sort(() => Math.random() - 0.5);
            for(let i=0; i<32; i++) {
                let val = items[i];
                let isKey = (val == 1000);
                grid.innerHTML += `
                    <div class="flip-card" onclick="flip(this, '${val}')">
                        <div class="front">${i+1}</div>
                        <div class="back ${isKey ? 'glowing-gold' : ''}">
                            ${isKey ? '<div class="key-icon">🔑</div><div class="key-text">1000</div>' : '<div class="val-text">'+val+'</div>'}
                        </div>
                    </div>`;
            }
        }

        function flip(el, val) {
            if (keyMode && isKeyFound) return;
            
            if(!el.classList.contains('flipped')) {
                el.classList.add('flipped');
                
                // في وضع المفتاح، لا نمرر أي بيانات للجمع
                if(keyMode) {
                    if(val == 1000) isKeyFound = true;
                    return; 
                }

                if(!freeMode && !revealed) {
                    openOrder.push({val: val});
                    updateSums();
                }
            }
        }

        function updateSums() {
            // إضافة حماية: إذا كان وضع المفتاح فعالاً، اخرج فوراً
            if (keyMode) {
                document.getElementById('box1').innerText = 0;
                document.getElementById('box2').innerText = 0;
                return;
            }

            let s1 = 0, s2 = 0;
            openOrder.forEach((item, index) => {
                let val = parseInt(item.val);
                if(index < mode) s1 += val;
                else if(index < (mode * 2)) s2 += val;
            });
            
            document.getElementById('box1').innerText = s1;
            document.getElementById('box2').innerText = s2;

            if (openOrder.length >= (mode * 2)) {
                if (s1 > s2) document.getElementById('rect1').classList.add('winner');
                else if (s2 > s1) document.getElementById('rect2').classList.add('winner');
            }
        }

        function clearSums() {
            document.getElementById('box1').innerText = 0;
            document.getElementById('box2').innerText = 0;
            document.getElementById('rect1').classList.remove('winner');
            document.getElementById('rect2').classList.remove('winner');
            openOrder = [];
        }

        function resetAndShuffle() {
            freeMode = false; revealed = false; keyMode = false; isKeyFound = false;
            let cards = Array.from(document.querySelectorAll('.flip-card'));
            for(let card of cards) card.classList.remove('flipped');
            clearSums();
            renderGrid();
        }

        function activateKeyMode() { 
            keyMode = true; 
            isKeyFound = false; 
            freeMode = false;
            clearSums(); // تصفير فوري
            let cards = Array.from(document.querySelectorAll('.flip-card'));
            for(let card of cards) card.classList.remove('flipped');
        }

        function setMode(m) { mode = m; keyMode = false; freeMode = false; resetAndShuffle(); }
        function activateFreeMode() { freeMode = true; keyMode = false; clearSums(); let cards = Array.from(document.querySelectorAll('.flip-card')); for(let card of cards) card.classList.remove('flipped'); }
        function toggleReveal() { revealed = !revealed; let cards = Array.from(document.querySelectorAll('.flip-card')); for(let card of cards) card.classList.toggle('flipped', revealed); clearSums(); }
        function makeFullScreen() { document.documentElement.requestFullscreen(); }
        
        renderGrid();
    </script>
</body>
</html>
